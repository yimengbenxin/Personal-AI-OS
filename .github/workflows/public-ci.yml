name: Public CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Server (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        suite: [gateway, integration, hermes, executor]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install local test prerequisites
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-wqy-zenhei age poppler-utils
          bash ci/install.sh "$SUITE"
      # Ubuntu 24.04 restricts unprivileged user namespaces by default.
      # This disposable runner has read-only repository permissions and no product secrets.
      # Allow the registration worker to create its namespaces; its sandbox checks still run.
      - name: Enable registration worker user namespaces
        if: matrix.suite == 'integration' || matrix.suite == 'hermes'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --net true
      - name: Run public suite
        env:
          SUITE: ${{ matrix.suite }}
          PAIOS_DEMUX_TOOLCHAIN: /usr/bin
          PAIOS_TEST_CJK_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
        run: python3 ci/public-tests.py "$SUITE"
  public-scan:
    name: Public tree scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Install scanner dependency
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan the checked-out PR tree
        run: python3 tools/oss-scan/scan.py --public --root .
