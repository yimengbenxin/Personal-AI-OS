plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
def gatewayOrigin = providers.gradleProperty("paiosGatewayOrigin")
        .orElse("https://gateway.example.invalid:9443").get()
// Existing installations retain migration identity through the Gradle properties below.
def legacyGatewayOrigin = providers.gradleProperty("paiosLegacyGatewayOrigin")
        .orElse("https://legacy.example.invalid").get()
[gatewayOrigin, legacyGatewayOrigin].each { origin ->
    def uri = new URI(origin)
    if (uri.scheme != "https" || !uri.host || uri.rawUserInfo != null || uri.rawPath != ""
            || uri.rawQuery != null || uri.rawFragment != null || uri.port < -1
            || uri.port == 0 || uri.port > 65535) throw new GradleException("PAIOS_GATEWAY_ORIGIN_INVALID")
}
def canonicalOrigin = { origin ->
    def uri = new URI(origin)
    new URI("https", null, uri.host.toLowerCase(java.util.Locale.ROOT),
            uri.port == 443 ? -1 : uri.port, null, null, null).toString()
}
gatewayOrigin = canonicalOrigin(gatewayOrigin)
legacyGatewayOrigin = canonicalOrigin(legacyGatewayOrigin)
// Secret values stay in generated build outputs. Prefer a file path to keep the key out of process arguments.
def amapKey = providers.gradleProperty("amapAndroidKey").orElse(providers.environmentVariable("AMAP_ANDROID_KEY"))
        .orElse(providers.environmentVariable("AMAP_ANDROID_KEY_FILE").map { new File(it).text.trim() }).orElse("").get().trim()
android {
    namespace "com.personalaios.glasses"
    compileSdk 35
    defaultConfig {
        manifestPlaceholders["AMAP_ANDROID_KEY"] = amapKey
        buildConfigField "boolean", "AMAP_CONFIGURED", (!amapKey.isEmpty()).toString()
        buildConfigField "String", "PAIOS_GATEWAY_ORIGIN", groovy.json.JsonOutput.toJson(gatewayOrigin)
        buildConfigField "String", "PAIOS_LEGACY_GATEWAY_ORIGIN", groovy.json.JsonOutput.toJson(legacyGatewayOrigin)
        applicationId "com.personalaios.glasses"
        minSdk 32
        targetSdk 35
        versionCode 1
        versionName "0.1.5"
        ndk { abiFilters "arm64-v8a" }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file(".build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { viewBinding true; buildConfig true }
    testOptions {
        unitTests.all { systemProperty "maven.repo.local", new File(gradle.gradleUserHomeDir, "robolectric").absolutePath }
    }
}
// Fail before compilation instead of silently omitting excluded local SDKs/models.
def requiredClientAssets = [
    "../../rayneo-android/upstream/rayneo-ardk-20260421/downloads/MercuryAndroidSDK-v0.2.6-20260310143142_94a01a90.aar": "B (RayNeo SDK)",
    "libs/sherpa-onnx-1.13.8.jar": "D (Android Sherpa runtime)",
    "src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so": "D (Android Sherpa runtime)"
]
["encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx",
 "decoder-epoch-12-avg-2-chunk-16-left-64.onnx",
 "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx", "tokens.txt", "keywords.txt"].each {
    requiredClientAssets["src/main/assets/kws/$it"] = "C (KWS model)"
}
requiredClientAssets.each { asset, step ->
    if (!file(asset).isFile()) throw new GradleException("Missing client asset $asset. Follow docs/clients.md, step $step.")
}
dependencies {
    // Official current artifact; Maven Central + https://lbs.amap.com/api/android-sdk/changelog/3d
    implementation "com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1"
    implementation files("../../rayneo-android/upstream/rayneo-ardk-20260421/downloads/MercuryAndroidSDK-v0.2.6-20260310143142_94a01a90.aar")
    // sherpa-onnx 1.13.8 (Apache-2.0, libs/sherpa-onnx-LICENSE): classes.jar here and jniLibs/arm64-v8a/libsherpa-onnx-jni.so, both from
    // https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar (sha256 b22c3fc1…5471).
    implementation files("libs/sherpa-onnx-1.13.8.jar")
    implementation "io.livekit:livekit-android:2.27.0"
    implementation "com.aliyun.aio:AliVCSDK_ARTC:7.11.0"
    implementation "com.google.protobuf:protobuf-javalite:3.25.5"
    implementation "androidx.appcompat:appcompat:1.3.0"
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.fragment:fragment-ktx:1.5.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "com.google.crypto.tink:tink-android:1.15.0"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
